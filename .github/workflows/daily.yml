name: 信息雷达每日抓取

# 每天（Asia/Shanghai）自动跑：抓取 → 补解读 → 同步页面 → 提交数据 → 发布到 Pages
# GitHub 的 schedule 是「尽力而为」：官方承认高负载时段会延迟，实测 UTC 0 点前后
# 连续两天（10-27 的 00:00、10-28 的 00:15）触发都被直接丢弃。流水线是幂等的
# （重跑只补缺失解读、数据无变化就跳过提交），所以一天排 3 个触发时间兜底，
# 挤一个丢一个，总有一个能跑上；先跑成功的，后面的会快速空转退出。
# 08:15 / 09:35 / 11:05（北京时间）
on:
  schedule:
    - cron: "15 0 * * *"
    - cron: "35 1 * * *"
    - cron: "5 3 * * *"
  workflow_dispatch:
    inputs:
      skip_annotate:
        description: 跳过 LLM 补解读（只用已有解读快速重发）
        type: boolean
        default: false
  # 改了脚本或工作流时顺手跑一次验证；data/ 的提交不会触发，避免自我循环
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily.yml"
      - "scripts/**"
      - "web/**"

permissions:
  contents: write

concurrency:
  group: info-radar-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Asia/Shanghai
      INFO_RADAR_DIRECT: "1"      # 境外 runner 直连，不探测本机代理端口
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取当日榜单
        run: |
          set -o pipefail
          python scripts/radar.py | tee /tmp/radar.log

      - name: 汇总抓取结果
        if: always()
        run: |
          echo "### 抓取结果" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          sed -n '1p' /tmp/radar.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sed -n '2p' /tmp/radar.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: 用大模型补解读
        if: ${{ inputs.skip_annotate != true }}
        run: |
          set -o pipefail
          python scripts/annotate_llm.py | tee /tmp/annotate.log
          echo "### 解读" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/annotate.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 同步页面与数据
        run: python scripts/sync_site.py

      - name: 提交数据变更
        run: |
          git config user.name  "info-radar-bot"
          git config user.email "info-radar-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            # commit message 里带上解读与抓取的运行结果，方便事后在 git log 里核对
            {
              echo "data: $(date +%F) 榜单与解读"
              echo
              echo "抓取：$(sed -n '1p' /tmp/radar.log 2>/dev/null)"
              echo
              echo "解读：$(cat /tmp/annotate.log 2>/dev/null || echo '未运行')"
            } > /tmp/commitmsg.txt
            git commit -F /tmp/commitmsg.txt
            git push
          fi

      - name: 发布到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          force_orphan: true
          commit_message: "pages: ${{ github.run_id }}"
