<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>信息雷达 · 每日技术趋势</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --ink: #14181f;
    --ink-2: #4b5565;
    --ink-3: #8b95a5;
    --line: #e6e9ef;
    --accent: #3355e8;
    --accent-soft: #eef1ff;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 0 20px 56px; }

  /* ---------- hero ---------- */
  .hero {
    background: linear-gradient(135deg, #1b2440 0%, #26365f 48%, #33477d 100%);
    color: #fff;
    padding: 30px 0 26px;
    margin-bottom: 18px;
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: "";
    position: absolute;
    right: -120px; top: -160px;
    width: 420px; height: 420px;
    background: radial-gradient(circle, rgba(102,138,255,.42) 0%, rgba(102,138,255,0) 68%);
  }
  .hero .wrap { position: relative; padding-bottom: 0; }
  .hero-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
  .title-row { display: flex; align-items: center; gap: 12px; }
  .radar-dot {
    width: 11px; height: 11px; border-radius: 50%;
    background: #6ee7a8;
    box-shadow: 0 0 0 4px rgba(110,231,168,.18);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(110,231,168,.18); }
    50% { box-shadow: 0 0 0 9px rgba(110,231,168,.05); }
  }
  h1 { font-size: 25px; font-weight: 700; margin: 0; letter-spacing: .4px; }
  .sub { color: rgba(255,255,255,.62); font-size: 13px; margin: 6px 0 0; }
  .hero-meta { display: flex; gap: 26px; }
  .stat-num { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .stat-lab { font-size: 11px; color: rgba(255,255,255,.58); letter-spacing: .6px; }

  /* ---------- toolbar ---------- */
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .nav-btn, .refresh {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink-2);
    border-radius: 9px; padding: 7px 13px; font-size: 12.5px; cursor: pointer;
    font-family: inherit; transition: all .16s ease; display: inline-flex; align-items: center;
  }
  .nav-btn:hover:not(:disabled), .refresh:hover { border-color: #c9d1e6; color: var(--ink); }
  .nav-btn:disabled { opacity: .42; cursor: default; }
  .date-input {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 9px; padding: 6px 10px; font-size: 12.5px; font-family: inherit;
  }
  .range-note { font-size: 12px; color: var(--ink-3); }
  .spacer { flex: 1; }

  /* ---------- 日/周/月 切换 ---------- */
  .view-switch {
    display: inline-flex; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 3px; gap: 2px;
  }
  .view-btn {
    border: none; background: transparent; color: var(--ink-2);
    border-radius: 8px; padding: 5px 16px; font-size: 12.5px; cursor: pointer;
    font-family: inherit; transition: all .16s ease; font-weight: 500;
  }
  .view-btn:hover { color: var(--ink); }
  .view-btn.on { background: var(--accent); color: #fff; box-shadow: 0 3px 9px rgba(51,85,232,.22); }
  .view-hint { font-size: 12px; color: var(--ink-3); }

  /* ---------- date chips ---------- */
  .dates-scroll { overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
  .dates { display: flex; gap: 8px; flex-wrap: nowrap; }
  .date-chip {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink-2);
    border-radius: 999px; padding: 6px 14px; font-size: 12.5px; cursor: pointer;
    transition: all .16s ease; display: inline-flex; align-items: center; gap: 7px;
    font-family: inherit; white-space: nowrap;
  }
  .date-chip:hover { border-color: #c9d1e6; color: var(--ink); }
  .date-chip.on {
    background: var(--accent); border-color: var(--accent); color: #fff;
    box-shadow: 0 4px 12px rgba(51,85,232,.24);
  }
  .date-chip .cnt { opacity: .6; font-size: 11px; }

  /* ---------- category tabs ---------- */
  .cats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .cat-tab {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink-2);
    border-radius: 10px; padding: 7px 15px; font-size: 13px; cursor: pointer;
    font-family: inherit; transition: all .16s ease; display: inline-flex;
    align-items: center; gap: 8px;
  }
  .cat-tab:hover { border-color: #c9d1e6; }
  .cat-tab.on { background: #14181f; border-color: #14181f; color: #fff; }
  .cat-tab .n {
    font-size: 11px; padding: 0 6px; border-radius: 6px;
    background: rgba(0,0,0,.07); color: var(--ink-3);
  }
  .cat-tab.on .n { background: rgba(255,255,255,.16); color: rgba(255,255,255,.8); }

  /* ---------- 速览 ---------- */
  .digest { margin: 0 0 16px; }
  .digest-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 9px 2px; }
  .digest-head .lab { font-size: 14px; font-weight: 700; letter-spacing: .3px; }
  .digest-head .sub { font-size: 12px; color: var(--ink-3); }
  .digest-body {
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 10px; padding: 11px 15px; font-size: 12.5px; color: var(--ink-2);
    line-height: 1.75; overflow-wrap: anywhere;
  }
  .digest-body .d-top { color: var(--ink); font-weight: 600; margin-bottom: 3px; }
  .digest-body .d-kw { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .digest-body .d-kw .kw {
    font-size: 11px; padding: 1px 7px; border-radius: 6px;
    background: #f2f5fa; color: var(--ink-2);
  }
  .digest-body .d-srcs { font-size: 11.5px; color: var(--ink-3); margin-top: 6px; }

  /* ---------- 来源区块（全宽，非瀑布流） ---------- */
  .src-block {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); overflow: hidden; margin-bottom: 14px;
  }
  .src-head {
    display: flex; align-items: center; gap: 9px;
    padding: 11px 16px; border-bottom: 1px solid var(--line); background: #fbfcfe;
  }
  .logo-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .src-name { font-weight: 650; font-size: 13.5px; letter-spacing: .2px; }
  .src-sub { font-size: 11.5px; color: var(--ink-3); }
  .src-count { margin-left: auto; font-size: 11.5px; color: var(--ink-3); }
  .src-summary {
    font-size: 11.5px; color: var(--ink-2); background: #f7f9fc;
    border-bottom: 1px solid var(--line); padding: 7px 16px 8px; line-height: 1.6;
    overflow-wrap: anywhere;
  }
  .src-summary .lab { color: var(--ink-3); margin-right: 5px; }

  .row-item {
    display: flex; gap: 12px; padding: 9px 16px 10px;
    border-bottom: 1px solid #f2f4f8; transition: background .14s ease;
  }
  .row-item:last-child { border-bottom: none; }
  .row-item:hover { background: #fafbfe; }
  .ri-rank, .ri-date {
    flex: none; width: 26px; height: 22px; border-radius: 6px; margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
    background: #f0f2f6; color: var(--ink-3);
  }
  .ri-date { width: 44px; font-weight: 600; font-size: 10.5px; }
  .ri-rank.r1 { background: #fff3d6; color: #a97400; }
  .ri-rank.r2 { background: #eef1f5; color: #5d6b7d; }
  .ri-rank.r3 { background: #fbeee5; color: #a25e2c; }
  .ri-main { min-width: 0; flex: 1; }
  .ri-title {
    font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.5;
    overflow-wrap: anywhere;
  }
  .row-item:hover .ri-title { color: var(--accent); }
  .ri-note {
    font-size: 12px; color: #2c3a55; line-height: 1.6; margin-top: 3px;
    overflow-wrap: anywhere;
  }
  .ri-note .lab {
    font-size: 10.5px; font-weight: 700; color: var(--accent); margin-right: 5px;
    letter-spacing: .5px;
  }
  .ri-desc {
    font-size: 11.5px; color: var(--ink-3); margin-top: 2px;
    overflow-wrap: anywhere;
  }
  .ri-scene {
    display: inline-block; margin-top: 4px; font-size: 10.5px; color: var(--ink-2);
    background: #f2f5fa; border-radius: 6px; padding: 1px 7px; overflow-wrap: anywhere;
  }
  .ri-scene b { color: var(--ink-3); font-weight: 600; margin-right: 4px; }
  .ri-side {
    flex: none; width: 132px; text-align: right; font-size: 11px;
    color: var(--ink-3); padding-top: 2px;
  }
  .ri-heat { color: var(--ink-2); line-height: 1.5; overflow-wrap: anywhere; }
  .ri-heat .hl { color: #1f8a5b; font-weight: 600; }
  .ri-meta { margin-top: 3px; }
  .more-btn {
    display: block; width: 100%; border: none; border-top: 1px dashed var(--line);
    background: #fbfcfe; color: var(--accent); font-family: inherit; font-size: 12px;
    padding: 8px 16px; text-align: center; cursor: pointer;
  }
  .more-btn:hover { background: var(--accent-soft); }
  .board-tag {
    display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: .4px;
    padding: 0 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent);
  }
  .board-tag.week { background: #fff2e6; color: #b8672a; }
  .board-tag.month { background: #eaf7ef; color: #268052; }
  .board-tag.need { background: #f3ecff; color: #6b46c1; }

  .state { padding: 56px 24px; text-align: center; color: var(--ink-3); font-size: 13px; }
  .state b { display: block; color: var(--ink-2); font-size: 14px; margin-bottom: 6px; font-weight: 600; }
  .spin {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid #dfe3ec; border-top-color: var(--accent);
    animation: rot .8s linear infinite; margin: 0 auto 12px;
  }
  @keyframes rot { to { transform: rotate(360deg); } }

  .foot { text-align: center; color: var(--ink-3); font-size: 11.5px; margin-top: 26px; line-height: 1.8; }

  @media (max-width: 720px) {
    .ri-side { width: 88px; }
    .ri-date { width: 40px; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="hero-top">
      <div>
        <div class="title-row">
          <span class="radar-dot"></span>
          <h1>信息雷达</h1>
        </div>
        <p class="sub">每日增量 · 只留当天新上榜，按日 / 周 / 月回看</p>
      </div>
      <div class="hero-meta">
        <div>
          <div class="stat-num" id="statTotal">—</div>
          <div class="stat-lab" id="statTotalLab">当日新增</div>
        </div>
        <div>
          <div class="stat-num" id="statSrc">—</div>
          <div class="stat-lab">覆盖来源</div>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="toolbar">
    <button class="nav-btn" id="prevDay" type="button">&larr; 更早一天</button>
    <button class="nav-btn" id="nextDay" type="button">更晚一天 &rarr;</button>
    <input type="date" id="datePick" class="date-input" aria-label="跳转到指定日期">
    <div class="view-switch" id="viewSwitch">
      <button type="button" class="view-btn on" data-view="day">日</button>
      <button type="button" class="view-btn" data-view="week">周</button>
      <button type="button" class="view-btn" data-view="month">月</button>
    </div>
    <span class="view-hint" id="viewHint"></span>
    <div class="spacer"></div>
    <button class="refresh" id="moreBtn" type="button">加载更早 30 天</button>
    <button class="refresh" id="refreshBtn" type="button">刷新</button>
    <a class="refresh" href="sources.html">数据源</a>
  </div>

  <div class="dates-scroll">
    <div class="dates" id="dateBar">
      <button type="button" class="date-chip on">今天</button>
    </div>
  </div>

  <div class="cats" id="catBar">
    <button type="button" class="cat-tab on">热门产品<span class="n">—</span></button>
    <button type="button" class="cat-tab">热门话题</button>
    <button type="button" class="cat-tab">项目需求</button>
  </div>

  <div class="digest" id="digest"></div>

  <div id="content">
    <div class="src-block">
      <div class="state"><div class="spin"></div>正在读取榜单…</div>
    </div>
  </div>

  <div class="foot">
    来源：GitHub · Product Hunt · Hugging Face · Hacker News · Chrome 应用商店 · Firefox 插件 · GreasyFork · App Store · 少数派 · 今日头条 · 百度热搜 · 哔哩哔哩 · 掘金 · Lobsters · V2EX · Stack Overflow · w2solo<br>
    每天只保留此前 7 天没出现过的条目（增量更新），周末追加周榜、月末追加月榜
  </div>
</div>

<script>
(function () {
  // 数据源：静态 JSON 文件，日期 + 周期（daily / weekly / monthly）为单位
  var DATA_BASE = 'data/';
  var F = {
    title: 'title', date: 'date', source: 'source', board: 'board',
    rank: 'rank', desc: 'desc', heat: 'heat', link: 'url', cat: 'category',
    note: 'note', scene: 'scene'
  };
  var PLACEHOLDER_DESC = ['Show HN 新品首发', '技术社区热帖', 'Hacker News 首页',
                          'V2EX 热门讨论', 'V2EX 创意节点讨论', 'V2EX 创意', '社区提问'];
  var CAT_ORDER = ['热门产品', '热门话题', '项目需求'];
  var CAT_DESC = {
    '热门产品': '正在被市场验证的新产品与模型',
    '热门话题': '技术圈与开发者社区在聊什么',
    '项目需求': '真实用户说出的「我想要一个…」'
  };
  var SOURCE_ORDER = ['GitHub', 'Product Hunt', 'Hugging Face', 'Hacker News',
                      'Chrome 应用商店', 'Firefox 插件', 'GreasyFork',
                      'App Store', '少数派',
                      '今日头条', '百度热搜', '哔哩哔哩', '掘金',
                      'Lobsters', 'V2EX', 'Stack Overflow', 'w2solo'];
  var HIDDEN_SOURCES = ['Reddit', 'Steam'];
  var SOURCE_META = {
    'GitHub':           { sub: '趋势仓库', color: '#24292f' },
    'Product Hunt':     { sub: '新品投票', color: '#da552f' },
    'Hugging Face':     { sub: '模型趋势', color: '#e0a300' },
    'Hacker News':      { sub: '技术社区', color: '#ff6600' },
    'Chrome 应用商店':   { sub: 'Chrome 扩展', color: '#4285f4' },
    'Firefox 插件':      { sub: 'Firefox 扩展', color: '#ff7139' },
    'GreasyFork':       { sub: '油猴脚本', color: '#5a8f3d' },
    'App Store':        { sub: 'iOS 免费榜', color: '#007aff' },
    '少数派':            { sub: '好物与效率', color: '#d0021b' },
    '今日头条':          { sub: '中文热榜', color: '#f04142' },
    '百度热搜':          { sub: '搜索热度', color: '#2932e1' },
    '哔哩哔哩':          { sub: '热门视频', color: '#fb7299' },
    '掘金':             { sub: '技术热文', color: '#1e80ff' },
    'Lobsters':         { sub: '极客热帖', color: '#b3202c' },
    'V2EX':             { sub: '中文社区', color: '#77808c' },
    'Stack Overflow':   { sub: '开发者难题', color: '#f48024' },
    'w2solo':           { sub: '独立开发者', color: '#f5a623' }
  };
  // 视图周期：日 = 当天；周 = 截至所选日期的 7 天；月 = 30 天
  var VIEW_DAYS = { day: 1, week: 7, month: 30 };
  // 「高频词」里的噪音词（多来自 App Store / 视频标题的碎片）
  var KW_STOP = ['ltd', 'co', 'inc', 'llc', 'tab', 'app', 'apps', 'the', 'and',
                 'for', 'with', 'new', 'free', 'pro', 'max', 'web', 'com'];

  var state = {
    rows: [], dates: [], active: null,
    cat: '热门产品', view: 'day',
    range: 20, summaries: {}, loaded: {}, index: null, expanded: {}
  };
  var els = {
    content: document.getElementById('content'),
    dateBar: document.getElementById('dateBar'),
    digest: document.getElementById('digest'),
    catBar: document.getElementById('catBar'),
    viewSwitch: document.getElementById('viewSwitch'),
    viewHint: document.getElementById('viewHint'),
    total: document.getElementById('statTotal'),
    totalLab: document.getElementById('statTotalLab'),
    src: document.getElementById('statSrc'),
    refresh: document.getElementById('refreshBtn'),
    prev: document.getElementById('prevDay'),
    next: document.getElementById('nextDay'),
    pick: document.getElementById('datePick'),
    more: document.getElementById('moreBtn'),
    rangeNote: null
  };

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function isoDaysAgo(days) {
    var d = new Date();
    d.setDate(d.getDate() - days);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function shiftIso(iso, delta) {
    var p = String(iso || '').split('-');
    if (p.length < 3) return iso;
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    d.setDate(d.getDate() + delta);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function dayOf(v) {
    if (!v) return '';
    var s = String(v);
    return s.length >= 10 ? s.slice(0, 10) : s;
  }

  function mdOf(iso) {
    var p = String(iso || '').split('-');
    return p.length >= 3 ? (Number(p[1]) + '/' + Number(p[2])) : iso;
  }

  function fmtDate(iso) {
    var p = iso.split('-');
    if (p.length < 3) return iso;
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    var w = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][d.getDay()];
    var label = iso === isoDaysAgo(0) ? '今天'
      : (iso === isoDaysAgo(1) ? '昨天' : (Number(p[1]) + '月' + Number(p[2]) + '日'));
    return label + ' · ' + w;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // 字段文本已逐个 escapeHtml；此处再用 DOMParser 做结构白名单清洗
  function sanitizeHtml(str) {
    var doc;
    try {
      doc = new DOMParser().parseFromString(str, 'text/html');
    } catch (e) {
      return '';
    }
    if (!doc || !doc.body) return '';
    var blocked = doc.body.querySelectorAll('script,iframe,object,embed,style,link,meta');
    for (var i = 0; i < blocked.length; i++) {
      if (blocked[i].parentNode) blocked[i].parentNode.removeChild(blocked[i]);
    }
    var all = doc.body.querySelectorAll('*');
    for (var j = 0; j < all.length; j++) {
      var attrs = Array.prototype.slice.call(all[j].attributes || []);
      for (var k = 0; k < attrs.length; k++) {
        var name = String(attrs[k].name).toLowerCase();
        var value = String(attrs[k].value || '').replace(/\s/g, '');
        if (name.indexOf('on') === 0 || /^javascript:/i.test(value)) {
          all[j].removeAttribute(attrs[k].name);
        }
      }
    }
    return doc.body.innerHTML;
  }

  // ---------------- data ----------------

  function fetchJson(path) {
    return fetch(path, { cache: 'no-cache' }).then(function (res) {
      if (!res.ok) { throw new Error(path + ' HTTP ' + res.status); }
      return res.json();
    });
  }

  function dayFiles(dateStr, periods) {
    var ps = periods && periods.length ? periods : ['daily'];
    return ps.map(function (p) { return DATA_BASE + dateStr + '-' + p + '.json'; });
  }

  function putSummaries(list, dateStr) {
    (list || []).forEach(function (s) {
      if (!s || !s.category) return;
      state.summaries[dateStr + '|' + s.category + '|' + (s.source || '')] = s.text || '';
    });
  }

  function putItems(list, dateStr) {
    (list || []).forEach(function (it) {
      if (!it) return;
      if (HIDDEN_SOURCES.indexOf(it[F.source]) >= 0) return;
      it[F.date] = dateStr;
      state.rows.push(it);
    });
  }

  function loadDay(dateStr, periods) {
    if (state.loaded[dateStr]) { return Promise.resolve(); }
    state.loaded[dateStr] = true;
    var files = dayFiles(dateStr, periods);
    return Promise.all(files.map(function (f) {
      return fetchJson(f).then(function (doc) {
        putItems(doc.items, dateStr);
        putSummaries(doc.summaries, dateStr);
      }).catch(function (err) {
        console.warn('[信息雷达] 跳过文件', err.message);
      });
    }));
  }

  function periodsOf(iso) {
    var periods = null;
    if (state.index) {
      (state.index.days || []).forEach(function (d) {
        if (d.date === iso) { periods = d.periods; }
      });
    }
    return periods;
  }

  // 按 index.json 加载 [from, to] 之间缺失的日期
  function ensureDays(fromIso, toIso) {
    if (!state.index) return Promise.resolve();
    var queue = [];
    (state.index.days || []).forEach(function (d) {
      if (d.date >= fromIso && d.date <= toIso && !state.loaded[d.date]) {
        queue.push(loadDay(d.date, d.periods));
      }
    });
    return Promise.all(queue);
  }

  function loadData() {
    fetchJson(DATA_BASE + 'index.json').then(function (idx) {
      state.index = idx;
      var days = (idx.days || []).slice(0, state.range);
      if (!days.length) { showState('暂无榜单数据', '还没有生成任何 JSON 数据文件。'); return; }
      var queue = days.map(function (d) { return loadDay(d.date, d.periods); });
      return Promise.all(queue).then(function () {
        rebuildDates();
        if (!state.active || state.dates.indexOf(state.active) < 0) {
          state.active = state.dates.length ? state.dates[0] : null;
        }
        renderDates();
        renderAll();
      });
    }).catch(function (err) {
      console.error('[信息雷达] 索引读取失败', err);
      showState('数据加载失败', '读取 data/index.json 失败，请稍后点击刷新重试。');
    });
  }

  function rebuildDates() {
    var map = {};
    state.rows.forEach(function (r) {
      var d = dayOf(r[F.date]);
      if (d) map[d] = (map[d] || 0) + 1;
    });
    state.dates = Object.keys(map).sort().reverse();
  }

  function loadExactDate(iso) {
    var periods = periodsOf(iso);
    delete state.loaded[iso];
    state.rows = state.rows.filter(function (r) { return dayOf(r[F.date]) !== iso; });
    loadDay(iso, periods || ['daily', 'weekly', 'monthly']).then(function () {
      rebuildDates();
      state.active = iso;
      renderDates();
      renderAll();
      var n = state.rows.filter(function (r) { return dayOf(r[F.date]) === iso; }).length;
      if (!n) {
        showState(iso + ' 没有记录', '这天没有抓取数据，换一个日期或点「加载更早」。');
      }
    });
  }

  function stepDay(delta) {
    var i = state.dates.indexOf(state.active);
    if (i < 0) return;
    var j = i + delta;
    if (j < 0 || j >= state.dates.length) return;
    state.active = state.dates[j];
    renderDates();
    renderAll();
  }

  // ---------------- 视图窗口 ----------------

  function viewStart() {
    return shiftIso(state.active, -(VIEW_DAYS[state.view] - 1));
  }

  function rowsForView() {
    if (!state.active) return [];
    var start = viewStart(), end = state.active;
    return state.rows.filter(function (r) {
      var d = dayOf(r[F.date]);
      return d >= start && d <= end;
    });
  }

  function needExtraDays() {
    if (!state.index || !state.active) return Promise.resolve();
    return ensureDays(viewStart(), state.active);
  }

  // ---------------- 速览 ----------------

  function parseSummary(text) {
    var parts = String(text || '').split(' · ').filter(function (x) { return x && x.trim(); });
    var out = { count: '', top: '', kws: [], srcs: '', lines: [] };
    parts.forEach(function (seg) {
      var t = seg.trim();
      if (!t) return;
      if (!out.count && /^\d+\s*条$/.test(t)) { out.count = t; return; }
      if (t.indexOf('覆盖') === 0) { out.srcs = t.replace(/^覆盖\s*/, ''); return; }
      if (t.indexOf('高频') === 0) {
        var body = t.replace(/^高频[：:]\s*/, '');
        out.kws = body.split('、').filter(function (k) {
          var w = String(k).replace(/\(\d+\)$/, '')
            .replace(/[^A-Za-z0-9\u4e00-\u9fa5]+/g, '').toLowerCase();
          // 「高频」里常混进 App Store 标题里的无意义词（ltd/tab/co…），过滤掉
          return w.length > 2 && KW_STOP.indexOf(w) < 0;
        }).slice(0, 8);
        return;
      }
      if (t.indexOf('榜首') === 0) { out.top = t; return; }
      out.lines.push(t);
    });
    return out;
  }

  function quickSummary(rows) {
    if (!rows.length) return '暂无数据';
    var srcSet = {};
    rows.forEach(function (r) { srcSet[r[F.source] || ''] = 1; });
    var top = rows.slice().sort(function (a, b) {
      return (a[F.rank] || 999) - (b[F.rank] || 999);
    })[0];
    return rows.length + ' 条 · 覆盖 ' + Object.keys(srcSet).join('、')
      + ' · 榜首「' + (top[F.title] || '') + '」' + (top[F.heat] || '');
  }

  function renderDigest(rows, cat) {
    if (!els.digest) return;
    var catRows = rows.filter(function (r) { return (r[F.cat] || '热门产品') === cat; });
    if (!catRows.length) { els.digest.innerHTML = ''; return; }
    var stored = state.view === 'day'
      ? (state.summaries[state.active + '|' + cat + '|全部'] || '')
      : '';
    var info = parseSummary(stored || quickSummary(catRows));
    var label = state.view === 'day' ? fmtDate(state.active) + ' 速览'
      : '近 ' + VIEW_DAYS[state.view] + ' 天速览（截至 ' + mdOf(state.active) + '）';

    var html = '<div class="digest-head"><span class="lab">' + escapeHtml(cat) + '</span>'
      + '<span class="sub">' + escapeHtml(label) + ' · ' + catRows.length + ' 条</span></div>'
      + '<div class="digest-body">';
    if (info.top) html += '<div class="d-top">' + escapeHtml(info.top) + '</div>';
    info.lines.forEach(function (ln) {
      html += '<div>' + escapeHtml(ln) + '</div>';
    });
    if (info.kws.length) {
      html += '<div class="d-kw">';
      info.kws.forEach(function (k) { html += '<span class="kw">' + escapeHtml(k) + '</span>'; });
      html += '</div>';
    }
    html += '<div class="d-srcs">来源：' + escapeHtml(info.srcs || '—') + '</div></div>';
    els.digest.innerHTML = sanitizeHtml(html);
  }

  // ---------------- render ----------------

  function renderDates() {
    if (!state.dates.length) { els.dateBar.innerHTML = ''; return; }
    var html = '';
    state.dates.forEach(function (d) {
      var cnt = state.rows.filter(function (r) { return dayOf(r[F.date]) === d; }).length;
      html += '<button type="button" class="date-chip' + (d === state.active ? ' on' : '')
        + '" data-date="' + d + '">' + escapeHtml(fmtDate(d))
        + '<span class="cnt">' + cnt + '</span></button>';
    });
    els.dateBar.innerHTML = sanitizeHtml(html);
    Array.prototype.forEach.call(els.dateBar.querySelectorAll('.date-chip'), function (btn) {
      btn.addEventListener('click', function () {
        state.active = btn.getAttribute('data-date');
        needExtraDays().then(function () {
          renderDates();
          renderAll();
        });
      });
    });
    var i = state.dates.indexOf(state.active);
    els.prev.disabled = i < 0 || i >= state.dates.length - 1;
    els.next.disabled = i <= 0;
  }

  function countByCat(rows) {
    var map = {};
    rows.forEach(function (r) {
      var c = r[F.cat] || '热门产品';
      map[c] = (map[c] || 0) + 1;
    });
    return map;
  }

  function renderCats(rows) {
    var counts = countByCat(rows);
    var html = '';
    CAT_ORDER.forEach(function (c) {
      html += '<button type="button" class="cat-tab' + (state.cat === c ? ' on' : '')
        + '" data-cat="' + escapeHtml(c) + '">' + escapeHtml(c)
        + '<span class="n">' + (counts[c] || 0) + '</span></button>';
    });
    els.catBar.innerHTML = sanitizeHtml(html);
    Array.prototype.forEach.call(els.catBar.querySelectorAll('.cat-tab'), function (btn) {
      btn.addEventListener('click', function () {
        state.cat = btn.getAttribute('data-cat');
        renderAll();
      });
    });
  }

  function heatHtml(text) {
    if (!text) return '';
    return String(text).split(' · ').map(function (part) {
      if (/^\+\d/.test(part)) return '<span class="hl">' + escapeHtml(part) + '</span>';
      return escapeHtml(part);
    }).join(' · ');
  }

  function linkOf(r) {
    var lv = r[F.link];
    if (Object.prototype.toString.call(lv) === '[object Array]') { lv = lv[0]; }
    if (lv && typeof lv === 'object' && lv.link) { lv = lv.link; }
    return (typeof lv === 'string' && lv) ? lv : '#';
  }

  function boardTag(board) {
    var cls = board === '周榜' ? ' week' : (board === '月榜' ? ' month' : (board === '需求榜' ? ' need' : ''));
    return '<span class="board-tag' + cls + '">' + escapeHtml(board || '热榜') + '</span>';
  }

  // 全宽列表行：左序号/日期，中内容，右热度
  function rowHtml(r, idx) {
    var rank = r[F.rank] || idx + 1;
    var cls = rank === 1 ? ' r1' : (rank === 2 ? ' r2' : (rank === 3 ? ' r3' : ''));
    var desc = r[F.desc] || '';
    if (PLACEHOLDER_DESC.indexOf(desc) >= 0) { desc = ''; }
    var note = r[F.note] || '';
    var scene = r[F.scene] || '';
    var left = state.view === 'day'
      ? '<span class="ri-rank' + cls + '">' + escapeHtml(rank) + '</span>'
      : '<span class="ri-date">' + escapeHtml(mdOf(dayOf(r[F.date]))) + '</span>';
    return '<a class="row-item" href="' + escapeHtml(linkOf(r)) + '" target="_blank" rel="noopener">'
      + left
      + '<div class="ri-main">'
      + '<div class="ri-title">' + escapeHtml(r[F.title] || '') + '</div>'
      + (note ? '<div class="ri-note"><span class="lab">解读</span>' + escapeHtml(note) + '</div>' : '')
      + (desc ? '<div class="ri-desc">' + escapeHtml(desc) + '</div>' : '')
      + (scene ? '<span class="ri-scene"><b>场景</b>' + escapeHtml(scene) + '</span>' : '')
      + '</div>'
      + '<div class="ri-side">'
      + (r[F.heat] ? '<div class="ri-heat">' + heatHtml(r[F.heat]) + '</div>' : '')
      + '<div class="ri-meta">' + boardTag(r[F.board]) + '</div>'
      + '</div></a>';
  }

  function srcBlock(src, rows) {
    var meta = SOURCE_META[src] || { sub: '', color: '#8b95a5' };
    var sum = state.view === 'day'
      ? (state.summaries[state.active + '|' + state.cat + '|' + src] || '')
      : '';
    rows.sort(function (a, b) {
      var da = dayOf(a[F.date]), db = dayOf(b[F.date]);
      if (da !== db) return da < db ? 1 : -1;
      return (a[F.rank] || 999) - (b[F.rank] || 999);
    });
    // 周 / 月视图条目多，默认先展示 20 条，其余点开再看
    var key = state.active + '|' + state.view + '|' + state.cat + '|' + src;
    var limit = state.view === 'day' ? rows.length : 20;
    var expanded = !!state.expanded[key];
    var shown = expanded ? rows : rows.slice(0, limit);
    var html = '<section class="src-block"><div class="src-head">'
      + '<span class="logo-dot" style="background:' + meta.color + '"></span>'
      + '<span class="src-name">' + escapeHtml(src) + '</span>'
      + '<span class="src-sub">' + escapeHtml(meta.sub) + '</span>'
      + '<span class="src-count">' + rows.length + ' 条</span></div>'
      + (sum ? '<div class="src-summary"><span class="lab">速览</span>' + escapeHtml(sum) + '</div>' : '');
    shown.forEach(function (r, i) { html += rowHtml(r, i); });
    if (!expanded && rows.length > shown.length) {
      html += '<button type="button" class="more-btn" data-key="' + escapeHtml(key) + '">'
        + '展开其余 ' + (rows.length - shown.length) + ' 条</button>';
    }
    return html + '</section>';
  }

  function renderAll() {
    if (!state.active) {
      showState('暂无榜单数据', '定时任务每天 08:00 抓取并写入，稍后刷新即可。');
      return;
    }
    var rows = rowsForView();
    renderCats(rows);
    renderDigest(rows, state.cat);

    els.total.textContent = rows.length;
    els.totalLab.textContent = state.view === 'day' ? '当日新增'
      : ('近 ' + VIEW_DAYS[state.view] + ' 天新增');
    var srcSet = {};
    rows.forEach(function (r) { if (r[F.source]) srcSet[r[F.source]] = 1; });
    els.src.textContent = Object.keys(srcSet).length;

    els.viewHint.textContent = state.view === 'day'
      ? '仅看 ' + mdOf(state.active) + ' 新上榜'
      : mdOf(viewStart()) + ' – ' + mdOf(state.active) + ' 累计新上榜';

    var catRows = rows.filter(function (r) { return (r[F.cat] || '热门产品') === state.cat; });
    if (!catRows.length) {
      showState('该分类暂无新增条目', state.view === 'day'
        ? '这一天没有该分类的新上榜内容，试试切到「周」或换一天。'
        : '这段时间没有该分类的新上榜内容，换个分类或日期看看。');
      return;
    }

    var bySrc = {};
    catRows.forEach(function (r) {
      var s = r[F.source] || '其他';
      (bySrc[s] = bySrc[s] || []).push(r);
    });
    var srcs = Object.keys(bySrc).sort(function (a, b) {
      return SOURCE_ORDER.indexOf(a) - SOURCE_ORDER.indexOf(b);
    });

    var html = '<div class="cat-head" style="display:flex;align-items:baseline;gap:10px;margin:0 0 12px 2px">'
      + '<span style="font-size:15px;font-weight:700;letter-spacing:.3px">' + escapeHtml(state.cat) + '</span>'
      + '<span style="font-size:12px;color:var(--ink-3)">'
      + escapeHtml(CAT_DESC[state.cat] || '') + ' · ' + catRows.length + ' 条</span></div>';
    srcs.forEach(function (s) { html += srcBlock(s, bySrc[s]); });

    els.content.innerHTML = sanitizeHtml(html);
  }

  function showState(title, hint) {
    if (els.digest) els.digest.innerHTML = '';
    els.content.innerHTML = sanitizeHtml('<div class="src-block"><div class="state"><b>'
      + escapeHtml(title) + '</b>' + escapeHtml(hint || '') + '</div></div>');
    els.total.textContent = '0';
    els.src.textContent = '0';
  }

  // ---------------- boot ----------------

  function boot() {
    els.refresh.addEventListener('click', function () {
      els.refresh.disabled = true;
      els.refresh.textContent = '刷新中…';
      state.rows = []; state.dates = []; state.active = null;
      state.summaries = {}; state.loaded = {};
      els.content.innerHTML = sanitizeHtml('<div class="src-block"><div class="state"><div class="spin"></div>正在读取榜单…</div></div>');
      loadData();
      setTimeout(function () {
        els.refresh.disabled = false;
        els.refresh.textContent = '刷新';
      }, 1200);
    });
    els.prev.addEventListener('click', function () { stepDay(1); });
    els.next.addEventListener('click', function () { stepDay(-1); });
    els.pick.addEventListener('change', function () {
      var v = els.pick.value;
      if (v) loadExactDate(v);
    });
    els.more.addEventListener('click', function () {
      if (state.range >= 365) return;
      state.range = Math.min(365, state.range + 30);
      els.more.disabled = true;
      els.more.textContent = '加载中…';
      state.rows = []; state.dates = []; state.summaries = {}; state.loaded = {};
      loadData();
      setTimeout(function () {
        els.more.disabled = false;
        els.more.textContent = '加载更早 30 天';
      }, 1500);
    });
    // 展开某个来源的其余条目
    els.content.addEventListener('click', function (e) {
      var btn = e.target && e.target.closest ? e.target.closest('.more-btn') : null;
      if (!btn) return;
      e.preventDefault();
      state.expanded[btn.getAttribute('data-key')] = true;
      renderAll();
    });
    // 日 / 周 / 月 切换
    Array.prototype.forEach.call(els.viewSwitch.querySelectorAll('.view-btn'), function (btn) {
      btn.addEventListener('click', function () {
        Array.prototype.forEach.call(els.viewSwitch.querySelectorAll('.view-btn'), function (b) {
          b.classList.remove('on');
        });
        btn.classList.add('on');
        state.view = btn.getAttribute('data-view');
        needExtraDays().then(function () {
          renderDates();
          renderAll();
        });
      });
    });
    loadData();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
