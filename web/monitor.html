<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据监控 · Chrome 插件运营</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --ink: #14181f;
    --ink-2: #4b5565;
    --ink-3: #8b95a5;
    --line: #e6e9ef;
    --accent: #3355e8;
    --accent-soft: #eef1ff;
    --up: #1f8a5b;
    --down: #c0392b;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 0 20px 56px; }

  .hero {
    background: linear-gradient(135deg, #14203a 0%, #1e3a63 48%, #2a5683 100%);
    color: #fff;
    padding: 34px 0 30px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: "";
    position: absolute;
    right: -120px; top: -160px;
    width: 420px; height: 420px;
    background: radial-gradient(circle, rgba(102,138,255,.42) 0%, rgba(102,138,255,0) 68%);
  }
  .hero .wrap { position: relative; padding-bottom: 0; }
  .hero-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
  .title-row { display: flex; align-items: center; gap: 12px; }
  .pulse-dot {
    width: 11px; height: 11px; border-radius: 50%;
    background: #6ee7a8;
    box-shadow: 0 0 0 4px rgba(110,231,168,.18);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(110,231,168,.18); }
    50% { box-shadow: 0 0 0 9px rgba(110,231,168,.05); }
  }
  h1 { font-size: 25px; font-weight: 700; margin: 0; letter-spacing: .4px; }
  .sub { color: rgba(255,255,255,.62); font-size: 13px; margin: 6px 0 0; }
  .hero-meta { display: flex; gap: 26px; }
  .stat-num { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .stat-lab { font-size: 11px; color: rgba(255,255,255,.58); letter-spacing: .6px; }

  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .nav-btn, .range-chip {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink-2);
    border-radius: 9px; padding: 7px 14px; font-size: 12.5px; cursor: pointer;
    font-family: inherit; transition: all .16s ease;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .nav-btn:hover, .range-chip:hover { border-color: #c9d1e6; color: var(--ink); }
  .range-chip.on {
    background: var(--accent); border-color: var(--accent); color: #fff;
    box-shadow: 0 4px 12px rgba(51,85,232,.24);
  }
  .spacer { flex: 1; }
  .range-note { font-size: 12px; color: var(--ink-3); }

  /* ---------- 插件区块 ---------- */
  .ext-block { margin-bottom: 30px; }
  .ext-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px 2px; }
  .ext-name { font-size: 15px; font-weight: 700; letter-spacing: .3px; }
  .ext-sub { font-size: 12px; color: var(--ink-3); }

  .kpi-grid {
    display: grid; gap: 14px; align-items: stretch;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    margin-bottom: 14px;
  }
  .kpi {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 13px 15px 12px;
  }
  .kpi .k-lab { font-size: 11px; color: var(--ink-3); letter-spacing: .5px; margin-bottom: 4px; }
  .kpi .k-num { font-size: 21px; font-weight: 700; line-height: 1.25; }
  .kpi .k-sub { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
  .kpi .k-sub .up { color: var(--up); font-weight: 600; }
  .kpi .k-sub .down { color: var(--down); font-weight: 600; }

  .charts {
    display: grid; gap: 14px; align-items: stretch;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  }
  .chart-card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 15px 16px 12px;
    border-top: 3px solid var(--accent);
  }
  .chart-card.t2 { border-top-color: #0f9d76; }
  .chart-card.t3 { border-top-color: #b8672a; }
  .chart-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .chart-name { font-size: 13px; font-weight: 650; }
  .chart-sub { font-size: 11px; color: var(--ink-3); margin-left: auto; }
  .chart-card svg { width: 100%; height: 150px; display: block; }
  .chart-foot {
    display: flex; justify-content: space-between;
    font-size: 10.5px; color: var(--ink-3); margin-top: 4px;
  }

  .state { padding: 56px 24px; text-align: center; color: var(--ink-3); font-size: 13px; }
  .state b { display: block; color: var(--ink-2); font-size: 14px; margin-bottom: 6px; font-weight: 600; }
  .spin {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid #dfe3ec; border-top-color: var(--accent);
    animation: rot .8s linear infinite; margin: 0 auto 12px;
  }
  @keyframes rot { to { transform: rotate(360deg); } }

  .setup {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px 22px; text-align: left;
    max-width: 640px; margin: 0 auto;
  }
  .setup ol { margin: 8px 0 0; padding-left: 20px; color: var(--ink-2); font-size: 12.5px; }
  .setup ol li { margin-bottom: 7px; line-height: 1.7; }
  .setup code {
    background: #f2f5fa; border-radius: 5px; padding: 1px 6px;
    font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--accent); overflow-wrap: anywhere;
  }
  .foot { text-align: center; color: var(--ink-3); font-size: 11.5px; margin-top: 26px; line-height: 1.8; }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="hero-top">
      <div>
        <div class="title-row">
          <span class="pulse-dot"></span>
          <h1>数据监控</h1>
        </div>
        <p class="sub">Chrome 插件运营数据 · Chrome Web Store 官方 API · 随信息雷达每日更新</p>
      </div>
      <div class="hero-meta">
        <div>
          <div class="stat-num" id="statExt">—</div>
          <div class="stat-lab">监控插件</div>
        </div>
        <div>
          <div class="stat-num" id="statDate">—</div>
          <div class="stat-lab">最新数据日</div>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="toolbar">
    <a class="nav-btn" href="index.html">&larr; 返回信息雷达</a>
    <button type="button" class="range-chip" data-days="7">近 7 天</button>
    <button type="button" class="range-chip" data-days="14">近 14 天</button>
    <button type="button" class="range-chip on" data-days="30">近 30 天</button>
    <button type="button" class="range-chip" data-days="90">近 90 天</button>
    <div class="spacer"></div>
    <span class="range-note" id="rangeNote"></span>
    <button class="nav-btn" id="refreshBtn" type="button">刷新</button>
  </div>

  <div id="content">
    <div class="state"><div class="spin"></div>正在读取监控数据…</div>
  </div>

  <div class="foot">
    数据来源：Chrome Web Store API v2（publishers.items.queryMetrics）<br>
    指标口径：installs 累计安装 · installs-7d 近 7 天安装 · uninstalls 卸载 · users 日活 · users-7d 七日活 · impressions 曝光 · page-views 详情页浏览
  </div>
</div>

<script>
(function () {
  var DATA_FILE = 'data/monitor.json';
  var RANGE = ['7', '14', '30', '90'];
  var els = {
    content: document.getElementById('content'),
    ext: document.getElementById('statExt'),
    date: document.getElementById('statDate'),
    note: document.getElementById('rangeNote'),
    refresh: document.getElementById('refreshBtn')
  };
  var state = { doc: null, days: 30 };

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function fmtNum(n) {
    n = Number(n) || 0;
    if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + 'w';
    return String(n);
  }
  function fmtDate(iso) {
    var p = String(iso || '').split('-');
    if (p.length < 3) return iso || '—';
    return Number(p[1]) + '月' + Number(p[2]) + '日';
  }
  function daysAgoIso(n) {
    var d = new Date();
    d.setDate(d.getDate() - n);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  // ---------------- SVG 迷你趋势图 ----------------
  // series: [{date, value}]，按日期升序
  function sparkline(series, color) {
    if (!series.length) return '<svg viewBox="0 0 600 160"></svg>';
    var W = 600, H = 160, PAD = 8;
    var vals = series.map(function (s) { return s.value; });
    var max = Math.max.apply(null, vals), min = Math.min.apply(null, vals);
    if (max === min) { max = min + 1; }
    var step = series.length > 1 ? (W - PAD * 2) / (series.length - 1) : 0;
    var pts = series.map(function (s, i) {
      var x = PAD + i * step;
      var y = H - PAD - ((s.value - min) / (max - min)) * (H - PAD * 2);
      return [x, y];
    });
    var line = pts.map(function (p) {
      return p[0].toFixed(1) + ',' + p[1].toFixed(1);
    }).join(' ');
    // 面积填充
    var area = pts.length > 1
      ? '<polygon points="' + PAD + ',' + (H - PAD) + ' ' + line + ' '
        + pts[pts.length - 1][0].toFixed(1) + ',' + (H - PAD) + '" fill="'
        + color + '" opacity="0.08"/>'
      : '';
    var dots = '';
    if (pts.length) {
      var last = pts[pts.length - 1];
      dots = '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1)
        + '" r="3.5" fill="' + color + '"/>'
        + '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1)
        + '" r="7" fill="' + color + '" opacity="0.18"/>';
    }
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">'
      + area
      + '<polyline points="' + line + '" fill="none" stroke="' + color
      + '" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'
      + dots + '</svg>';
  }

  function chartCard(title, sub, cls, series, color, unit) {
    var foot = '';
    if (series.length) {
      foot = '<div class="chart-foot"><span>'
        + escapeHtml(fmtDate(series[0].date)) + '</span>'
        + '<span>峰值 ' + escapeHtml(fmtNum(Math.max.apply(null, series.map(function (s) { return s.value; })))) + unit
        + '</span><span>' + escapeHtml(fmtDate(series[series.length - 1].date))
        + '</span></div>';
    }
    return '<div class="chart-card ' + cls + '">'
      + '<div class="chart-head"><span class="chart-name">' + escapeHtml(title)
      + '</span><span class="chart-sub">' + escapeHtml(sub) + '</span></div>'
      + (series.length
        ? sparkline(series, color)
        : '<div class="state" style="padding:36px 12px">该区间暂无数据</div>')
      + foot + '</div>';
  }

  // ---------------- 渲染 ----------------
  function render() {
    var doc = state.doc;
    if (!doc || !(doc.extensions || []).length) {
      showEmpty();
      return;
    }
    var cutoff = daysAgoIso(state.days - 1);
    var rows = (doc.rows || []).filter(function (r) { return r.date >= cutoff; });

    var html = '';
    (doc.extensions || []).forEach(function (ext) {
      var series = rows.filter(function (r) { return r.id === ext.id; })
        .sort(function (a, b) { return a.date < b.date ? -1 : 1; });
      var latest = series.length ? series[series.length - 1] : null;
      // 环比：上一个有数据的日期
      var prev = series.length > 1 ? series[series.length - 2] : null;
      var dauDelta = '';
      if (latest && prev && prev.users) {
        var pct = ((latest.users - prev.users) / prev.users * 100).toFixed(0);
        var cls = latest.users >= prev.users ? 'up' : 'down';
        dauDelta = '<span class="' + cls + '">较前一日 ' + (pct >= 0 ? '+' : '') + pct + '%</span>';
      }
      // 区间聚合（逐日指标求和）
      var sum = function (key) {
        return series.reduce(function (a, r) { return a + (Number(r[key]) || 0); }, 0);
      };
      var sumUninstall = sum('uninstalls'), sumImp = sum('impressions'), sumPv = sum('page_views');

      html += '<section class="ext-block"><div class="ext-head">'
        + '<span class="ext-name">' + escapeHtml(ext.name) + '</span>'
        + '<span class="ext-sub">' + escapeHtml(ext.id) + ' · '
        + (series.length ? '近 ' + series.length + ' 天数据' : '暂无数据') + '</span></div>';

      if (!series.length) {
        html += '<div class="state" style="padding:34px 16px">该插件在所选区间暂无数据（官方接口 T+1，首次运行后次日起有数）</div></section>';
        return;
      }

      html += '<div class="kpi-grid">'
        + kpi('日活（最新）', fmtNum(latest.users), dauDelta)
        + kpi('累计安装', fmtNum(latest.installs), '近 7 天 +' + fmtNum(latest.installs_7d))
        + kpi('卸载（区间合计）', fmtNum(sumUninstall))
        + kpi('商店曝光（区间）', fmtNum(sumImp))
        + kpi('详情页浏览（区间）', fmtNum(sumPv))
        + '</div>';

      html += '<div class="charts">'
        + chartCard('安装量趋势', '累计安装', 't1', series.map(function (r) {
            return { date: r.date, value: r.installs }; }), '#3355e8', '')
        + chartCard('日活趋势', 'users', 't2', series.map(function (r) {
            return { date: r.date, value: r.users }; }), '#0f9d76', '')
        + chartCard('每日卸载', 'uninstalls', 't3', series.map(function (r) {
            return { date: r.date, value: r.uninstalls }; }), '#b8672a', '')
        + '</div></section>';
    });

    els.content.innerHTML = html;
    els.ext.textContent = (doc.extensions || []).length;
    var latestDate = '';
    (doc.rows || []).forEach(function (r) {
      if (r.date > latestDate) latestDate = r.date;
    });
    els.date.textContent = latestDate ? fmtDate(latestDate) : '—';
    els.note.textContent = (doc.updated_at ? '更新于 ' + doc.updated_at.slice(5, 16) + ' · ' : '')
      + '区间内 ' + rows.length + ' 行数据';
  }

  function kpi(lab, num, sub) {
    return '<div class="kpi"><div class="k-lab">' + escapeHtml(lab) + '</div>'
      + '<div class="k-num">' + escapeHtml(num) + '</div>'
      + (sub ? '<div class="k-sub">' + sub + '</div>' : '') + '</div>';
  }

  function showEmpty() {
    els.ext.textContent = '0';
    els.date.textContent = '—';
    els.note.textContent = '';
    els.content.innerHTML = '<div class="state" style="padding-top:30px"><b>还没有监控数据</b>'
      + '尚未配置插件或首次抓取还未运行。</div>'
      + '<div class="setup"><b>接入步骤（Chrome Web Store 官方 API）</b><ol>'
      + '<li>在 <code>scripts/monitor_config.json</code> 填入 publisher ID、插件 ID 与 OAuth 三件套'
      + '（client_id / client_secret / refresh_token，scope 为 <code>chromewebstore.readonly</code>）。</li>'
      + '<li>本地执行 <code>python3 scripts/monitor.py</code> 拉取数据，'
      + 'GitHub Actions 每日抓取会自动带上监控步骤。</li>'
      + '<li>数据写入 <code>data/monitor.json</code>，本页自动展示 KPI 与趋势图。</li>'
      + '</ol></div>';
  }

  // ---------------- boot ----------------
  function boot() {
    Array.prototype.forEach.call(document.querySelectorAll('.range-chip'), function (btn) {
      btn.addEventListener('click', function () {
        Array.prototype.forEach.call(document.querySelectorAll('.range-chip'), function (b) {
          b.classList.remove('on');
        });
        btn.classList.add('on');
        state.days = Number(btn.getAttribute('data-days'));
        render();
      });
    });
    els.refresh.addEventListener('click', function () {
      els.refresh.disabled = true;
      els.refresh.textContent = '刷新中…';
      loadData();
      setTimeout(function () {
        els.refresh.disabled = false;
        els.refresh.textContent = '刷新';
      }, 1200);
    });
    loadData();
  }

  function loadData() {
    fetch(DATA_FILE, { cache: 'no-cache' })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (doc) {
        state.doc = doc;
        render();
      })
      .catch(function () {
        state.doc = null;
        render();
      });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
